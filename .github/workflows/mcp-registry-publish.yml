name: Publish to the MCP Registry

# Publishes the root server.json (remote-only, the hosted /mcp endpoint) to the
# official MCP Registry at registry.modelcontextprotocol.io under the
# io.github.nxtg-ai namespace. Authentication is GitHub OIDC from this
# repository, so no secret is stored. Manual dispatch: run it after a release
# that changes server.json (its version must equal packages/api).

on:
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC login to the registry
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      # sha256 of mcp-publisher_linux_amd64.tar.gz, from that release's registry_1.8.1_checksums.txt
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v4

      - name: server.json version equals the API version
        run: |
          listed=$(jq -r .version server.json)
          api=$(jq -r .version packages/api/package.json)
          echo "server.json $listed, packages/api $api"
          test "$listed" = "$api"

      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Log in to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish server.json

      - name: Read the entry back
        run: |
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.nxtg-ai/faultline" \
            | jq -e '.servers | map(.server.name) | index("io.github.nxtg-ai/faultline") != null'
