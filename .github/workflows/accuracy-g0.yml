# Pre-registered verdict-accuracy run (G0) against the hosted API.
# Spec: docs/research/2026-10-02-prereg-verdict-accuracy-g0-v1.md (§6, §7, §8, A1).
# How to run and read it: docs/research/accuracy-g0-harness.md
#
# Dispatch only. Two fixed inputs, nothing free-form:
#   full              all 661 gold items
#   verify-subsample  the 100 committed ids (prereg §8 re-run by a lane that did
#                     not gather the evidence); paired against the committed full
#                     run when exactly one is in docs/research/data/
#
# Every item is a real grounded Gemini prompt on production's key, counted by
# production's grounding-allowance and spend ledgers. The runner stops itself
# before the day's grounded prompts would pass 1,000 (exit 3) and can be
# re-dispatched the next Pacific day; it starts a new out file and a new attempt
# ledger each dispatch, so a dispatch never resumes an earlier one.
#
# Needs the repo secret FAULTLINE_ADMIN_KEY (the hosted API's admin key). It is
# never printed. The job fails at the first step if the secret is missing.
name: Accuracy G0

on:
  workflow_dispatch:
    inputs:
      set:
        description: 'Which items to run'
        required: true
        type: choice
        options:
          - full
          - verify-subsample
      engine:
        description: 'deployed = the live Fly engine; branch = start the API from the dispatched ref on this runner (ruling 67cd2d8b: verdict-logic changes are measured on a branch before deploy)'
        required: true
        default: deployed
        type: choice
        options:
          - deployed
          - branch

permissions:
  contents: read
  actions: read

# Two dispatches at once would double-spend the grounding allowance.
concurrency:
  group: accuracy-g0
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SET: ${{ inputs.set }}
      ENGINE: ${{ inputs.engine }}
      FAULTLINE_ADMIN_KEY: ${{ secrets.FAULTLINE_ADMIN_KEY }}
    steps:
      - name: Require the admin key secret
        run: |
          if [ -z "$FAULTLINE_ADMIN_KEY" ]; then
            echo "::error::Repo secret FAULTLINE_ADMIN_KEY is not set. fp sets it (prereg A1); nothing was sent."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # numpy pinned to the version that drew the committed subsample.
      - name: Install scorer dependencies
        run: pip install numpy==2.3.5 pytest

      - name: Scorer self-test (it must be able to fail)
        run: python3 -m pytest scripts/tests -q

      # Branch mode (GoPMO 1.18.11.7.18 A0): the engine under test is this ref, run on the runner.
      # It spends the same Google key as production, so the runner's daily guard also reads
      # production's grounded-prompt count (--allowance-api). Ledgers live in RUNNER_TEMP. The spend
      # cap is checked before each batch, not reserved, so one batch can cross it (codex findings 4):
      # it is set to USD 28. Worst case for one 25-claim batch with the call ceilings: 25 x (USD 0.035
      # grounding + 5,120 output tokens x USD 2.50/M + 10,000 input tokens x USD 0.30/M) = USD 1.27
      # (rates: packages/api/src/store/consensus-cost.ts; 10,000 input is above the 2,270 measured max
      # of prompt plus tool-use tokens, 2026-10-21 sample). 28 + 1.27 < 30. The server log is not
      # uploaded: a provider error can quote reply text (codex findings 3 and 6).
      # The branch engine's grounding ledger starts empty on every dispatch, so a second G0 run on
      # the same Pacific day would not see the first one's prompts (codex review of f5d637c,
      # finding 7). Branch mode therefore refuses if any other Accuracy G0 run started today.
      - name: One G0 run per Pacific grounding day
        if: inputs.engine == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run keeps the run id and starts a fresh ledger, so it would not see its first attempt.
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "::error::Branch mode does not allow re-runs (attempt ${GITHUB_RUN_ATTEMPT}); dispatch a new run after the next reset. Nothing was sent."
            exit 1
          fi
          # Look back to 180 minutes (the job timeout) before Pacific midnight, so a run that started
          # late yesterday and spends after midnight still counts.
          SINCE=$(python3 -c "from datetime import datetime,timezone,timedelta; from zoneinfo import ZoneInfo; n=datetime.now(ZoneInfo('America/Los_Angeles')); print((n.replace(hour=0,minute=0,second=0,microsecond=0)-timedelta(minutes=180)).astimezone(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          OTHERS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/accuracy-g0.yml/runs?created=>=${SINCE}&per_page=100" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})] | length")
          echo "other Accuracy G0 runs since ${SINCE}: ${OTHERS}"
          if [ "$OTHERS" != "0" ]; then
            echo "::error::Another Accuracy G0 run started this Pacific day; its grounded prompts are not visible to a fresh branch engine. Dispatch after the next reset. Nothing was sent."
            exit 1
          fi

      - name: Start the branch engine
        if: inputs.engine == 'branch'
        env:
          G0_GEMINI_KEY: ${{ secrets.FAULTLINE_G0_GEMINI_KEY }}
        run: |
          if [ -z "$G0_GEMINI_KEY" ]; then
            echo "::error::Repo secret FAULTLINE_G0_GEMINI_KEY is not set; branch mode needs it. Nothing was sent."
            exit 1
          fi
          # The USD 30 bound below assumes every call carries an output ceiling (GoPMO 1.18.11.7.18 A).
          if [ ! -f packages/cli/providers/call-ceilings.ts ]; then
            echo "::error::This ref has no packages/cli/providers/call-ceilings.ts, so a batch's cost is not bounded. Nothing was sent."
            exit 1
          fi
          npm ci --no-audit --no-fund
          L="$RUNNER_TEMP/g0-engine"; mkdir -p "$L"
          cd packages/api
          PORT=3010 HOST=127.0.0.1 FAULTLINE_API_KEY="$FAULTLINE_ADMIN_KEY" GEMINI_API_KEY="$G0_GEMINI_KEY" \
            FAULTLINE_GIT_SHA="$GITHUB_SHA" FAULTLINE_PROVIDER_SPEND_CAP=on FAULTLINE_PROVIDER_SPEND_CAP_USD=28 \
            FAULTLINE_PROVIDER_SPEND_LEDGER="$L/provider-spend.jsonl" FAULTLINE_GROUNDING_LEDGER="$L/grounding.jsonl" \
            FAULTLINE_FULL_JOBS_LEDGER="$L/full-jobs.jsonl" FAULTLINE_AUDIT_PATH="$L/audit.jsonl" \
            nohup npx tsx src/index.ts > "$L/server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -m 2 http://127.0.0.1:3010/health > "$L/health.json" 2>/dev/null; then break; fi
            sleep 2
          done
          python3 -c "import json,sys,os; h=json.load(open(sys.argv[1])); c=h.get('commit'); print('branch engine', c); sys.exit(0 if c==os.environ['GITHUB_SHA'] else 1)" "$L/health.json"

      - name: Run
        id: runner
        run: |
          mkdir -p out
          OUT="out/accuracy-g0-${SET}-${GITHUB_RUN_ID}.jsonl"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          set +e
          if [ "$ENGINE" = "branch" ]; then
            node scripts/accuracy-g0.mjs --set "$SET" --out "$OUT" --api http://127.0.0.1:3010 --allowance-api https://faultline-api.fly.dev
          else
            node scripts/accuracy-g0.mjs --set "$SET" --out "$OUT"
          fi
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "Runner exit $rc (0 done, 2 refused, 3 allowance stop, 4 INVALID, 5 spend cap)"

      - name: Score
        if: steps.runner.outputs.rc == '0'
        env:
          OUT: ${{ steps.runner.outputs.out }}
        run: |
          PAIRED=()
          if [ "$SET" = "verify-subsample" ]; then
            # The attempt ledger (<out>.attempts.jsonl) also matches the glob; it is not a run.
            mapfile -t originals < <(ls docs/research/data/accuracy-g0-full-*.jsonl 2>/dev/null | grep -v '\.attempts\.jsonl$' || true)
            if [ "${#originals[@]}" -eq 1 ]; then
              PAIRED=(--paired "${originals[0]}")
            else
              echo "No single committed full run to pair with (found ${#originals[@]}); scoring the re-run alone."
            fi
          fi
          python3 scripts/accuracy-g0-score.py "$OUT" --set "$SET" --json "${OUT%.jsonl}.score.json" "${PAIRED[@]}" \
            | tee "${OUT%.jsonl}.readout.txt"

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-g0-${{ inputs.set }}-${{ github.run_id }}
          path: out/
          if-no-files-found: warn

      - name: Upload the branch engine's ledgers
        if: always() && inputs.engine == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-g0-${{ inputs.set }}-branch-engine-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/g0-engine/provider-spend.jsonl
            ${{ runner.temp }}/g0-engine/grounding.jsonl
            ${{ runner.temp }}/g0-engine/health.json
          if-no-files-found: warn

      - name: Fail unless the run completed
        if: steps.runner.outputs.rc != '0'
        env:
          RC: ${{ steps.runner.outputs.rc }}
        run: |
          echo "::error::Runner exit ${RC}. See the log; exit 3 and 5 are resumable stops."
          exit 1
