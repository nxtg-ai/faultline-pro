name: Faultline AI Safety Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  faultline-scan:
    name: AI Safety Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # required for github/codeql-action/upload-sarif

    steps:
      - uses: actions/checkout@v4

      # Example 1: Red-team template scan (no API key needed)
      # continue-on-error: these are demo scans on sample text — findings are expected
      - name: Red-team scan (injection + bias)
        continue-on-error: true
        uses: ./.github/actions/faultline-scan
        with:
          templates: 'injection,bias'
          provider: 'mock'
          threshold: 'high'
          output-format: 'sarif'

      # Example 2: Scan a specific file
      - name: Scan sample text
        if: hashFiles('examples/sample.txt') != ''
        continue-on-error: true
        uses: ./.github/actions/faultline-scan
        with:
          input: 'examples/sample.txt'
          provider: 'mock'
          threshold: 'critical'
          rules: 'pii,bias,toxicity'

      # Example 3: Scan a directory
      - name: Scan examples directory
        if: hashFiles('examples/') != ''
        continue-on-error: true
        uses: ./.github/actions/faultline-scan
        with:
          dir: 'examples'
          provider: 'mock'
          threshold: 'critical'
          output-format: 'json'
