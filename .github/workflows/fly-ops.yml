# Fly operations for faultline-api that need FLY_API_TOKEN but not a deploy.
# The token lives only in this repo's secrets, so these run here instead of
# from a workstation. Fixed actions only: no free-form command input.
#
#   inspect                 machines, volumes and status (read-only)
#   secrets-list            secret NAMES and digests only (flyctl never shows values)
#   scale-to-one            run exactly one machine: the ledgers are append-only
#                           files, so a second machine would keep a second,
#                           diverging copy of the spend and grounding totals
#   create-ledger-volume    one 1 GB volume `faultline_ledgers` in lax, only if
#                           none exists (idempotent)
#
# Why the ledger volume: /var/log/faultline holds the append-only provider-spend,
# grounding-allowance and scan-cost ledgers. Without a volume every deploy
# starts them at zero (GoPMO 1.18.7.3.2, docs/ledger-volume.md).
name: Fly ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run'
        required: true
        type: choice
        options:
          - inspect
          - secrets-list
          - scale-to-one
          - create-ledger-volume
          - releases
          - logs
          - customer-keys-on
          - customer-keys-off

permissions:
  contents: read

concurrency:
  group: fly-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: faultline-api
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Inspect
        run: |
          flyctl status -a "$APP"
          echo "--- machines"
          flyctl machines list -a "$APP"
          echo "--- volumes"
          flyctl volumes list -a "$APP"

      - name: Secrets (names only)
        if: inputs.action == 'secrets-list'
        run: flyctl secrets list -a "$APP"

      # Customer API keys (FAULTLINE_CUSTOMER_KEYS). "on" only under emma-soul's
      # reopen ruling (Dx3 e2909e46); "off" is the kill switch if the production
      # two-key canary shows any cross-key result. Setting it restarts the machine,
      # which empties the in-memory keystore.
      - name: Customer keys on
        if: inputs.action == 'customer-keys-on'
        run: flyctl secrets set FAULTLINE_CUSTOMER_KEYS=on -a "$APP"

      - name: Customer keys off
        if: inputs.action == 'customer-keys-off'
        run: flyctl secrets unset FAULTLINE_CUSTOMER_KEYS -a "$APP"

      - name: Scale to one machine
        if: inputs.action == 'scale-to-one'
        run: |
          flyctl scale count 1 -a "$APP" --yes
          flyctl machines list -a "$APP"

      - name: Create ledger volume
        if: inputs.action == 'create-ledger-volume'
        run: |
          machines=$(flyctl machines list -a "$APP" --json | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          volumes=$(flyctl volumes list -a "$APP" --json | python3 -c "import sys,json; print(len([v for v in json.load(sys.stdin) if v.get('name')=='faultline_ledgers']))")
          echo "machines=$machines faultline_ledgers volumes=$volumes"
          if [ "$volumes" -ge 1 ]; then
            echo "Ledger volume already exists; nothing to create."
          else
            flyctl volumes create faultline_ledgers -a "$APP" --region lax --size 1 --yes
          fi
          flyctl volumes list -a "$APP"

      # Read-only, for incident forensics (GoPMO 1.18.11.3): deploy history
      # with times, and whatever recent log buffer Fly still holds.
      - name: Releases (deploy history)
        if: inputs.action == 'releases'
        run: |
          flyctl releases -a "$APP" --json > releases.json
          python3 -c "import json;d=json.load(open('releases.json'));print('count',len(d));print('keys',sorted(d[0].keys()) if d else []);[print(json.dumps({k:v for k,v in r.items() if k.lower() in ('version','createdat','created_at','status','description','reason','imageref','user')}, default=str)) for r in d]"

      - name: Release history (all pages, Fly GraphQL API)
        if: inputs.action == 'releases'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          tok = os.environ["FLY_API_TOKEN"].strip()
          auth = tok if tok.startswith("FlyV1 ") else "Bearer " + tok
          q = 'query($after:String){ app(name:"faultline-api"){ releases(first:100, after:$after){ nodes{ version createdAt status } pageInfo{ hasNextPage endCursor } } } }'
          after, rows = None, []
          while True:
              req = urllib.request.Request("https://api.fly.io/graphql", data=json.dumps({"query": q, "variables": {"after": after}}).encode(),
                                           headers={"Authorization": auth, "Content-Type": "application/json"})
              d = json.load(urllib.request.urlopen(req, timeout=30))
              if d.get("errors"): print("errors", d["errors"]); break
              r = d["data"]["app"]["releases"]; rows += r["nodes"]
              if not r["pageInfo"]["hasNextPage"]: break
              after = r["pageInfo"]["endCursor"]
          print("all releases", len(rows))
          for n in sorted(rows, key=lambda x: x["version"]): print("REL", n["version"], n["createdAt"], n["status"])
          PY

      - name: Recent logs (buffer only, request lines)
        if: inputs.action == 'logs'
        run: flyctl logs -a "$APP" --no-tail | grep -E 'GET|POST|graphql|claims' | tail -n 2000 || true

