name: 'Faultline Scan'
description: 'AI Trust & Safety scanner — verify AI claims, assess risk, ensure EU AI Act compliance'
author: 'Asif Waliuddin'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  provider:
    description: 'LLM provider to use (mock, gemini, claude, openai)'
    required: false
    default: 'mock'
  templates:
    description: 'Comma-separated red-team template categories to scan (injection, jailbreak, bias, hallucination, pii-leakage)'
    required: false
    default: ''
  input:
    description: 'Path to a single file to scan'
    required: false
    default: ''
  dir:
    description: 'Directory to scan recursively'
    required: false
    default: ''
  threshold:
    description: 'Maximum allowed severity before failing (critical, high, medium, low). Findings exceeding this level cause a non-zero exit.'
    required: false
    default: 'critical'
  min-confidence:
    description: 'Minimum confidence score (0.0-1.0) to include findings'
    required: false
    default: '0.0'
  rules:
    description: 'Comma-separated rule names to run (pii, bias, toxicity)'
    required: false
    default: ''
  output-format:
    description: 'Output format: json, markdown, html, sarif'
    required: false
    default: 'sarif'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  compliance-gate:
    description: 'Run EU AI Act compliance gate after scan (true/false). Fails workflow if non-compliant or high/critical risk.'
    required: false
    default: 'false'
  compliance-sarif:
    description: 'Generate and upload compliance SARIF to GitHub Code Scanning (true/false). Requires compliance-gate: true.'
    required: false
    default: 'true'
  compliance-threshold:
    description: 'Minimum compliance score (0–100) to pass. Default: 0 (only non-compliant articles fail).'
    required: false
  compliance-strict:
    description: 'Require all articles to be compliant or not-applicable (true/false)'
    required: false
    default: 'false'
  project-name:
    description: 'Project name for the EU AI Act compliance report'
    required: false

outputs:
  findings_count:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.findings_count }}
  critical_count:
    description: 'Number of critical-severity findings'
    value: ${{ steps.scan.outputs.critical_count }}
  high_count:
    description: 'Number of high-severity findings'
    value: ${{ steps.scan.outputs.high_count }}
  passed:
    description: 'Whether the scan passed the severity threshold (true/false)'
    value: ${{ steps.threshold.outputs.passed }}
  report:
    description: 'Path to the generated report file'
    value: ${{ steps.scan.outputs.report_path }}
  compliance-status:
    description: 'EU AI Act compliance gate result: pass or fail (only set when compliance-gate is true)'
    value: ${{ steps.compliance.outputs.compliance-status }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Faultline
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        npm install -g @nxtg/faultline || {
          echo "::notice::@nxtg/faultline not published yet, installing from source"
          cd "$ACTION_PATH"/../../..
          npm ci
        }

    - name: Run Faultline Scan
      id: scan
      shell: bash
      env:
        INPUT_TEMPLATES: ${{ inputs.templates }}
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_INPUT: ${{ inputs.input }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        INPUT_RULES: ${{ inputs.rules }}
        INPUT_NODE_VERSION: ${{ inputs.node-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # Derive file extension from output format (safe — only matches known literals)
        case "$INPUT_OUTPUT_FORMAT" in
          sarif)    EXT="sarif.json" ;;
          html)     EXT="html" ;;
          markdown) EXT="md" ;;
          *)        EXT="json" ;;
        esac
        REPORT_PATH="${RUNNER_TEMP}/faultline-report.${EXT}"

        # Build command args
        ARGS=""

        if [ -n "$INPUT_TEMPLATES" ]; then
          ARGS="scan --templates $INPUT_TEMPLATES"
        elif [ -n "$INPUT_DIR" ]; then
          ARGS="scan --dir $INPUT_DIR"
        elif [ -n "$INPUT_INPUT" ]; then
          ARGS="scan --input $INPUT_INPUT"
        else
          echo "::error::One of 'input', 'dir', or 'templates' must be specified"
          exit 1
        fi

        ARGS="$ARGS --provider $INPUT_PROVIDER"
        ARGS="$ARGS --output-format $INPUT_OUTPUT_FORMAT"

        if [ "$INPUT_MIN_CONFIDENCE" != "0.0" ]; then
          ARGS="$ARGS --min-confidence $INPUT_MIN_CONFIDENCE"
        fi

        if [ -n "$INPUT_RULES" ]; then
          ARGS="$ARGS --rules $INPUT_RULES"
        fi

        echo "::group::Faultline scan"
        echo "Running: faultline $ARGS"

        # Run scan, capture output
        if command -v faultline &> /dev/null; then
          faultline $ARGS > "$REPORT_PATH" 2>&1 || true
        else
          node "$ACTION_PATH"/../../../bin/faultline.js $ARGS > "$REPORT_PATH" 2>&1 || true
        fi
        echo "::endgroup::"

        echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"

        # Parse counts from SARIF or JSON output
        if [ "$INPUT_OUTPUT_FORMAT" = "sarif" ]; then
          FINDINGS_COUNT=$(node -e "
            const fs = require('fs');
            try {
              const sarif = JSON.parse(fs.readFileSync('$REPORT_PATH', 'utf-8'));
              console.log(sarif.runs?.[0]?.results?.length ?? 0);
            } catch { console.log(0); }
          ")
          CRITICAL_COUNT=$(node -e "
            const fs = require('fs');
            try {
              const sarif = JSON.parse(fs.readFileSync('$REPORT_PATH', 'utf-8'));
              const results = sarif.runs?.[0]?.results ?? [];
              console.log(results.filter(r => r.level === 'error').length);
            } catch { console.log(0); }
          ")
          HIGH_COUNT=$(node -e "
            const fs = require('fs');
            try {
              const sarif = JSON.parse(fs.readFileSync('$REPORT_PATH', 'utf-8'));
              const results = sarif.runs?.[0]?.results ?? [];
              console.log(results.filter(r => r.level === 'error').length);
            } catch { console.log(0); }
          ")
        else
          FINDINGS_COUNT=$(node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync('$REPORT_PATH', 'utf-8'));
              const rules = data.ruleFindings?.length ?? 0;
              const verifs = Object.values(data.verifications ?? {}).filter(v => v.status !== 'supported').length;
              console.log(rules + verifs);
            } catch { console.log(0); }
          ")
          CRITICAL_COUNT=$(node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync('$REPORT_PATH', 'utf-8'));
              const rules = (data.ruleFindings ?? []).filter(f => f.severity === 'critical').length;
              console.log(rules);
            } catch { console.log(0); }
          ")
          HIGH_COUNT=$(node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync('$REPORT_PATH', 'utf-8'));
              const rules = (data.ruleFindings ?? []).filter(f => f.severity === 'high').length;
              console.log(rules);
            } catch { console.log(0); }
          ")
        fi

        echo "findings_count=$FINDINGS_COUNT" >> "$GITHUB_OUTPUT"
        echo "critical_count=$CRITICAL_COUNT" >> "$GITHUB_OUTPUT"
        echo "high_count=$HIGH_COUNT" >> "$GITHUB_OUTPUT"

        echo "::notice::Faultline scan complete: $FINDINGS_COUNT findings ($CRITICAL_COUNT critical, $HIGH_COUNT high)"

    - name: Check Threshold
      id: threshold
      shell: bash
      env:
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        FINDINGS_COUNT: ${{ steps.scan.outputs.findings_count }}
        CRITICAL_COUNT: ${{ steps.scan.outputs.critical_count }}
        HIGH_COUNT: ${{ steps.scan.outputs.high_count }}
      run: |
        THRESHOLD="$INPUT_THRESHOLD"

        # Threshold levels: critical > high > medium > low
        # "critical" = only fail if critical findings exist
        # "high"     = fail if critical OR high findings exist
        # "medium"   = fail if critical, high, or medium findings exist
        # "low"      = fail if any findings exist

        PASSED="true"

        case "$THRESHOLD" in
          critical)
            if [ "$CRITICAL_COUNT" -gt 0 ] 2>/dev/null; then
              PASSED="false"
            fi
            ;;
          high)
            FAIL_COUNT=$(( ${CRITICAL_COUNT:-0} + ${HIGH_COUNT:-0} ))
            if [ "$FAIL_COUNT" -gt 0 ] 2>/dev/null; then
              PASSED="false"
            fi
            ;;
          medium|low)
            if [ "${FINDINGS_COUNT:-0}" -gt 0 ] 2>/dev/null; then
              PASSED="false"
            fi
            ;;
          *)
            echo "::error::Invalid threshold: $THRESHOLD. Must be critical, high, medium, or low."
            exit 1
            ;;
        esac

        echo "passed=$PASSED" >> "$GITHUB_OUTPUT"

        if [ "$PASSED" = "false" ]; then
          echo "::error::Faultline threshold check FAILED ($THRESHOLD). Found: $FINDINGS_COUNT findings ($CRITICAL_COUNT critical, $HIGH_COUNT high)."
          exit 1
        else
          echo "::notice::Faultline threshold check PASSED ($THRESHOLD). Found: $FINDINGS_COUNT findings."
        fi

    - name: Upload SARIF (if applicable)
      if: inputs.output-format == 'sarif' && always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.report_path }}
      continue-on-error: true

    - name: EU AI Act Compliance Gate
      id: compliance
      if: inputs.compliance-gate == 'true'
      shell: bash
      env:
        INPUT_PROJECT_NAME: ${{ inputs.project-name }}
        INPUT_THRESHOLD: ${{ inputs.compliance-threshold }}
        INPUT_STRICT: ${{ inputs.compliance-strict }}
        INPUT_COMPLIANCE_SARIF: ${{ inputs.compliance-sarif }}
        REPORT_PATH: ${{ steps.scan.outputs.report_path }}
      run: |
        echo "::group::EU AI Act Compliance Gate"
        # Determine scan input file
        if [ -f "$REPORT_PATH" ]; then
          SCAN_INPUT="$REPORT_PATH"
        else
          echo "::warning::No scan result found. Running fresh scan for compliance check."
          SCAN_INPUT="/tmp/fp-compliance-scan.json"
          faultline scan --dir . --provider mock --output-format json > "$SCAN_INPUT" 2>/dev/null || true
        fi
        # Build gate args
        CR_ARGS="compliance-report --input $SCAN_INPUT --ci"
        if [ -n "$INPUT_PROJECT_NAME" ]; then CR_ARGS="$CR_ARGS --project-name $INPUT_PROJECT_NAME"; fi
        if [ -n "$INPUT_THRESHOLD" ]; then CR_ARGS="$CR_ARGS --threshold $INPUT_THRESHOLD"; fi
        if [ "$INPUT_STRICT" = "true" ]; then CR_ARGS="$CR_ARGS --strict"; fi
        CR_ARGS="$CR_ARGS --output ${RUNNER_TEMP}/eu-compliance-report.json"
        OUTPUT=$(faultline $CR_ARGS) || EXIT_CODE=$?
        EXIT_CODE=${EXIT_CODE:-0}
        echo "$OUTPUT"
        # Generate compliance SARIF for Code Scanning
        if [ "$INPUT_COMPLIANCE_SARIF" = "true" ]; then
          SARIF_ARGS="compliance-report --input $SCAN_INPUT --format sarif"
          if [ -n "$INPUT_PROJECT_NAME" ]; then SARIF_ARGS="$SARIF_ARGS --project-name $INPUT_PROJECT_NAME"; fi
          if [ -n "$INPUT_THRESHOLD" ]; then SARIF_ARGS="$SARIF_ARGS --threshold $INPUT_THRESHOLD"; fi
          if [ "$INPUT_STRICT" = "true" ]; then SARIF_ARGS="$SARIF_ARGS --strict"; fi
          faultline $SARIF_ARGS --output "${RUNNER_TEMP}/compliance.sarif" || true
        fi
        echo "::endgroup::"
        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "compliance-status=pass" >> "$GITHUB_OUTPUT"
          echo "::notice::EU AI Act Compliance Gate: PASS"
        else
          echo "compliance-status=fail" >> "$GITHUB_OUTPUT"
          echo "::error::EU AI Act Compliance Gate: FAIL — non-compliant articles or high/critical risk detected"
          exit 1
        fi

    - name: Upload Compliance SARIF to GitHub Code Scanning
      if: inputs.compliance-gate == 'true' && inputs.compliance-sarif == 'true' && always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/compliance.sarif
        category: eu-ai-act-compliance
      continue-on-error: true
