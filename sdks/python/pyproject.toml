[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faultline-sdk"
version = "0.5.0"
description = "Python SDK for the Faultline Pro API — AI claim forensics and risk scoring"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "safety", "claims", "verification", "faultline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/nxtg-ai/faultline-pro"
Documentation = "https://github.com/nxtg-ai/faultline-pro/blob/main/sdks/python/README.md"
Repository = "https://github.com/nxtg-ai/faultline-pro"
