# Faultline Pro API — Fly.io configuration
# Deploy: fly deploy --config packages/api/fly.toml

app = "faultline-api"
primary_region = "lax"

[build]
  dockerfile = "../../Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# Append-only ledgers (provider spend, grounding allowance, scan cost) live on
# this volume so a deploy does not reset them. One volume means one machine:
# keep `flyctl scale count 1`, or each machine keeps its own diverging ledger
# (docs/ledger-volume.md, GoPMO 1.18.7.3.2).
[mounts]
  source = "faultline_ledgers"
  destination = "/var/log/faultline"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
