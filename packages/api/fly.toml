# fly.toml — Faultline API (packages/api)
# Deploy: fly launch --config packages/api/fly.toml
# Requires: fly.io account + FAULTLINE_API_KEY secret set via `fly secrets set`

app = "faultline-api"
primary_region = "lax"

[build]
  dockerfile = "packages/api/Dockerfile"
  # Dockerfile context is the monorepo root so workspace packages resolve correctly.

[env]
  NODE_ENV = "production"
  PORT = "3001"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
