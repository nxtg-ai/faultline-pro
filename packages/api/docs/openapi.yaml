      responses:
        "200":
          description: Deleted

  /templates:
    get:
      tags: [Templates]
      summary: List all saved scan configuration templates
      responses:
        "200":
          description: Template list
    post:
      tags: [Templates]
      summary: Create a reusable scan configuration template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                provider: { $ref: '#/components/schemas/Provider' }
                rules: { type: array, items: { type: string } }
                outputFormat: { type: string, enum: [json, markdown, html, sarif] }
      responses:
        "201":
          description: Template created

  /templates/{id}:
    delete:
      tags: [Templates]
      summary: Delete a scan template by ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted

  /jobs:
    get:
      tags: [Jobs]
      summary: List all scheduled scan jobs
      responses:
        "200":
          description: Job list
    post:
      tags: [Jobs]
      summary: Create a scheduled scan job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, text, schedule]
              properties:
                name: { type: string }
                text: { type: string }
                schedule: { type: string, example: "*/30 * * * *" }
                provider: { $ref: '#/components/schemas/Provider' }
                webhookUrl: { type: string, format: uri }
      responses:
        "201":
          description: Job created

  /jobs/{id}:
    delete:
      tags: [Jobs]
      summary: Delete a scheduled scan job
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted

  /jobs/{id}/progress:
    get:
      tags: [Jobs]
      summary: Get progress and results of a bulk scan job
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Job progress and per-file results
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [pending, processing, complete, failed] }
                  totalFiles: { type: integer }
                  processedFiles: { type: integer }
                  progressPercent: { type: integer }
                  fileResults: { type: array, items: { type: object } }
                  summary: { type: object, nullable: true }

  /costs:
    get:
      tags: [Analytics]
      summary: Per-scan cost estimates aggregated by provider and date
      parameters:
        - { name: provider, in: query, schema: { $ref: '#/components/schemas/Provider' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Cost data with aggregate
          content:
            application/json:
              schema:
                type: object
                properties:
                  costs: { type: array, items: { type: object } }
                  aggregate:
                    type: object
                    properties:
                      totalTokens: { type: integer }
                      totalCostUsd: { type: number }
                      byProvider: { type: object }

  /providers/health:
    get:
      tags: [Providers]
      summary: Health metrics for all built-in and plugin providers
      security: []
      responses:
        "200":
          description: Provider health metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers: { type: array, items: { type: object } }

  /providers/register:
    post:
      tags: [Providers]
      summary: Register a custom external provider plugin (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, endpoint]
              properties:
                name: { type: string }
                endpoint: { type: string, format: uri }
                apiKeyEnvVar: { type: string }
      responses:
        "201":
          description: Provider registered

  /tenants:
    get:
      tags: [Keys]
      summary: List all tenants
      responses:
        "200":
          description: Tenant list
    post:
      tags: [Keys]
      summary: Create a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                plan: { type: string, enum: [free, starter, pro, enterprise] }
      responses:
        "201":
          description: Tenant created

  /tenants/{id}:
    get:
      tags: [Keys]
      summary: Get a tenant by ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tenant object
        "404":
          description: Tenant not found
    delete:
      tags: [Keys]
      summary: Delete a tenant by ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted

  /tenants/{id}/keys:
    post:
      tags: [Keys]
      summary: Add an API key to a tenant
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyId]
              properties:
                keyId: { type: string }
      responses:
        "200":
          description: Key added

  /tenants/{id}/keys/{keyId}:
    delete:
      tags: [Keys]
      summary: Remove an API key from a tenant
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: keyId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Key removed

  /tenants/{id}/usage:
    get:
      tags: [Keys]
      summary: Aggregate usage across all keys in a tenant
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tenant usage aggregate
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenantId: { type: string }
                  totalScans: { type: integer }
                  byKey: { type: object }

  /graphql:
    post:
      tags: [GraphQL]
      summary: GraphQL API (queries + mutations)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, example: "{ scan(text: \"hello\", provider: \"mock\") { overallRisk } }" }
                variables: { type: object }
      responses:
        "200":
          description: GraphQL response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
                  errors: { type: array, items: { type: object } }

tags:
  - name: Scan
    description: Core claim forensics pipeline — text, batch, upload, deep, diff, compare, template.
  - name: Claims
    description: Claim index — search, trending, attribution, explainability, graphs, scan history.
  - name: Compliance
    description: EU AI Act classification, industry templates (HIPAA/SOX/FERPA/Gov), regulatory calendar.
  - name: Jobs
    description: Scheduled scan jobs and async bulk document import.
  - name: Templates
    description: Reusable scan configuration templates.
  - name: Analytics
    description: Usage dashboard, per-key counts, provider cost tracking.
  - name: Cache
    description: Content-hash result cache management.
  - name: Keys
    description: API key lifecycle, tenant management, and per-tenant usage.
  - name: Webhooks
    description: Event subscriptions with HMAC-SHA256 signing and 3-attempt retry.
  - name: Monitoring
    description: Health checks, Prometheus metrics, status page, provider health.
  - name: Providers
    description: Provider registry, health monitoring, custom plugin registration.
  - name: Reports
    description: Compliance PDF report generation.
  - name: GraphQL
    description: GraphQL API powered by Mercurius — queries and mutations.
