name: 'Faultline AI Claim Scanner v0.2'
description: 'Forensic AI claim verification — scan directories and files for factual risk, hallucinations, and compliance violations'
author: 'NXTG AI'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  input:
    description: 'Path to file to scan (mutually exclusive with dir and templates)'
    required: false
  path:
    description: 'Directory path to scan recursively'
    required: false
    default: '.'
  dir:
    description: 'Directory of files to scan (legacy — prefer "path")'
    required: false
  templates:
    description: 'Comma-separated template names (e.g. injection,bias)'
    required: false
  provider:
    description: 'AI provider: gemini, openai, claude, perplexity, mock'
    required: false
    default: 'mock'
  fail-on:
    description: 'Fail if risk at or above this level: critical, high, medium, low'
    required: false
    default: 'high'
  min-confidence:
    description: 'Minimum confidence threshold (0.0–1.0)'
    required: false
    default: '0.0'
  rules:
    description: 'Comma-separated rules to enforce (e.g. pii,toxicity)'
    required: false
  output-format:
    description: 'Output format: sarif, json, markdown'
    required: false
    default: 'sarif'
  upload-sarif:
    description: 'Upload SARIF results to GitHub Code Scanning (true/false)'
    required: false
    default: 'true'
  api-key:
    description: 'AI provider API key (for Gemini: GEMINI_API_KEY, OpenAI: OPENAI_API_KEY, etc.)'
    required: false
  compliance-gate:
    description: 'Run EU AI Act compliance gate after scan (true/false). Fails workflow if non-compliant.'
    required: false
    default: 'false'
  compliance-sarif:
    description: 'Generate and upload compliance SARIF to GitHub Code Scanning (true/false). Requires compliance-gate: true.'
    required: false
    default: 'true'
  compliance-threshold:
    description: 'Minimum compliance score (0–100) to pass. Default: 0 (only non-compliant articles fail).'
    required: false
  compliance-strict:
    description: 'Require all articles to be compliant or not-applicable (true/false)'
    required: false
    default: 'false'
  project-name:
    description: 'Project name for the compliance report (used when compliance-gate is true)'
    required: false

outputs:
  risk-level:
    description: 'Overall risk level: low, medium, high, or critical'
    value: ${{ steps.scan.outputs.risk-level }}
  findings-count:
    description: 'Number of claims flagged at or above the fail-on threshold'
    value: ${{ steps.scan.outputs.findings-count }}
  compliance-status:
    description: 'EU AI Act compliance gate result: pass or fail (only set when compliance-gate is true)'
    value: ${{ steps.compliance.outputs.compliance-status }}

runs:
  using: 'composite'
  steps:
    - name: Install Faultline CLI
      shell: bash
      run: npm install -g @nxtg/faultline

    - name: Run Faultline scan
      id: scan
      shell: bash
      env:
        INPUT_INPUT: ${{ inputs.input }}
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TEMPLATES: ${{ inputs.templates }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        INPUT_RULES: ${{ inputs.rules }}
        GEMINI_API_KEY: ${{ inputs.api-key }}
        OPENAI_API_KEY: ${{ inputs.api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
      run: |
        ARGS="scan"
        if [ -n "$INPUT_INPUT" ]; then ARGS="$ARGS --input $INPUT_INPUT"; fi
        if [ -n "$INPUT_DIR" ]; then ARGS="$ARGS --dir $INPUT_DIR"; fi
        if [ -z "$INPUT_INPUT" ] && [ -z "$INPUT_DIR" ] && [ -n "$INPUT_PATH" ]; then ARGS="$ARGS --dir $INPUT_PATH"; fi
        if [ -n "$INPUT_TEMPLATES" ]; then ARGS="$ARGS --templates $INPUT_TEMPLATES"; fi
        ARGS="$ARGS --provider $INPUT_PROVIDER"
        ARGS="$ARGS --output-format $INPUT_OUTPUT_FORMAT"
        ARGS="$ARGS --fail-on $INPUT_FAIL_ON"
        if [ "$INPUT_MIN_CONFIDENCE" != "0.0" ]; then ARGS="$ARGS --min-confidence $INPUT_MIN_CONFIDENCE"; fi
        if [ -n "$INPUT_RULES" ]; then ARGS="$ARGS --rules $INPUT_RULES"; fi
        faultline $ARGS

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.upload-sarif == 'true' && inputs.output-format == 'sarif'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
      continue-on-error: true

    - name: EU AI Act Compliance Gate
      id: compliance
      if: inputs.compliance-gate == 'true'
      shell: bash
      env:
        INPUT_PROJECT_NAME: ${{ inputs.project-name }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_THRESHOLD: ${{ inputs.compliance-threshold }}
        INPUT_STRICT: ${{ inputs.compliance-strict }}
        INPUT_COMPLIANCE_SARIF: ${{ inputs.compliance-sarif }}
        GEMINI_API_KEY: ${{ inputs.api-key }}
        OPENAI_API_KEY: ${{ inputs.api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
      run: |
        SCAN_FILE="scan-result.json"
        faultline scan --dir . --provider "$INPUT_PROVIDER" --output-format json > "$SCAN_FILE" 2>/dev/null || true
        CR_ARGS="compliance-report --input $SCAN_FILE --ci"
        if [ -n "$INPUT_PROJECT_NAME" ]; then CR_ARGS="$CR_ARGS --project-name $INPUT_PROJECT_NAME"; fi
        if [ -n "$INPUT_THRESHOLD" ]; then CR_ARGS="$CR_ARGS --threshold $INPUT_THRESHOLD"; fi
        if [ "$INPUT_STRICT" = "true" ]; then CR_ARGS="$CR_ARGS --strict"; fi
        CR_ARGS="$CR_ARGS --output eu-compliance-report.json"
        OUTPUT=$(faultline $CR_ARGS)
        EXIT_CODE=$?
        echo "$OUTPUT"
        # Generate SARIF for Code Scanning upload
        if [ "$INPUT_COMPLIANCE_SARIF" = "true" ]; then
          SARIF_ARGS="compliance-report --input $SCAN_FILE --format sarif"
          if [ -n "$INPUT_PROJECT_NAME" ]; then SARIF_ARGS="$SARIF_ARGS --project-name $INPUT_PROJECT_NAME"; fi
          if [ -n "$INPUT_THRESHOLD" ]; then SARIF_ARGS="$SARIF_ARGS --threshold $INPUT_THRESHOLD"; fi
          if [ "$INPUT_STRICT" = "true" ]; then SARIF_ARGS="$SARIF_ARGS --strict"; fi
          faultline $SARIF_ARGS --output compliance.sarif || true
        fi
        if [ $EXIT_CODE -eq 0 ]; then
          echo "compliance-status=pass" >> "$GITHUB_OUTPUT"
        else
          echo "compliance-status=fail" >> "$GITHUB_OUTPUT"
          exit 1
        fi

    - name: Upload Compliance SARIF to GitHub Code Scanning
      if: inputs.compliance-gate == 'true' && inputs.compliance-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: compliance.sarif
        category: eu-ai-act-compliance
      continue-on-error: true
