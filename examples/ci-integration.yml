# ci-integration.yml — check the claims in AI-written content on every pull request.
# Copy to .github/workflows/faultline.yml in your repository.
#
# Needs a Faultline API key (https://faultline.nxtg.ai/pricing), saved as the
# repository secret FAULTLINE_API_KEY. With that key the hosted API checks the
# claims, so no AI provider key is needed in your repository. (Without it, the
# action runs on your own provider key instead, for example GEMINI_API_KEY.)
#
# Uses the maintained action, nxtg-ai/faultline-action. Each scan step checks
# one file; repeat the step for each file you want gated.

name: Faultline claim check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'content/**'

jobs:
  faultline:
    name: Faultline claim check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # only needed for upload-sarif

    steps:
      - uses: actions/checkout@v5

      # Fails the build when a claim in the file is rated high risk or worse,
      # and uploads the findings to GitHub code scanning.
      - name: Check the claims in a content file
        uses: nxtg-ai/faultline-action@v1
        env:
          FAULTLINE_API_KEY: ${{ secrets.FAULTLINE_API_KEY }}
        with:
          mode: scan
          input: docs/ai-output.md
          fail-on: high
          upload-sarif: 'true'

      # Checks the pull request description itself. The text is passed as data,
      # never as shell input. With guard-fail-on the step fails on a refuted
      # claim and also when verification was degraded; without it, it only reports.
      - name: Check the pull request description
        uses: nxtg-ai/faultline-action@v1
        env:
          FAULTLINE_API_KEY: ${{ secrets.FAULTLINE_API_KEY }}
        with:
          mode: guard
          text: ${{ github.event.pull_request.body }}
          guard-fail-on: refuted
